key: letter-1
lang: mk
slug: prvo-pismo
title: Прво писмо
template: letter-one
header: Драги Коле и Стане,
blockOne:
  image: ../../../assets/letter-01/01.png
  alt: Човек влече канистри со вода, додека сонува за пиво.
  text: Вода нема. Ја влечеме од другиот крај на градот.
blockTwo:
  image: ../../../assets/letter-01/02.png
  alt: Глушец бега во дупка, додека влече човек што се држи за неговата опашка.
  text: Гранатите и понатаму паѓаат. Ги усовршивме начините на спасување.
blockThree:
  image: ../../../assets/letter-01/03.png
  alt: Луѓе претрчуваат улица, покрај табла „Внимавај, снајпер“.
  text: "Преку многу раскрсници и понатаму мора да се претрчува. Наместо семафори стојат табли со предупредувања:"
blockFour:
  image: ../../../assets/letter-01/04.png
  alt: Последното дрво во паркот, мала бреза со натпис „Кој ќе ја исече оваа бреза, ќе му биде последна“.
  text: "Зимава речиси сите дрвја во градот се исечени за огрев. Останало само по некое. Едно такво (една мала бреза) видов кај Ветеринарен факултет. На неа има табла со натпис:"
  treeInscription: Кој ќе ја исече оваа бреза, ќе му биде последна!

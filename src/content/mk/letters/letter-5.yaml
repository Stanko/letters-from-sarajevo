key: letter-5
lang: mk
slug: petto-pismo
title: Петто писмо
template: letter-five
date: Сараево, 2.XII 1993.
header: Драги Стане и Коле,
intro: "Кај мене ништо ново:"
newsImage:
  image: ../../../assets/letter-05/news.png
  alt: Нема струја, нема вода, нема леб, нема телефон
paragraphs:
  - text: Добив мала печка, која ја поставив во собата. На неа можам да сварам чај.
    caption: (Слика 1.)
  - text: Печката е мала, црна, грда. Затоа ѝ нацртав веѓи и нос. На вратичката веќе имаше кружни отвори низ кои се гледа пламенот. Кога ќе се отвори пепелникот, изгледа како да зева или да зборува.
    caption: (Слика 2.)
stoveImage:
  image: ../../../assets/letter-05/stove.png
  alt: Печка со доцртани веѓи и нос
signoff: Многу поздрави!

key: letter-1
lang: hu
slug: elso-level
title: Első levél
template: letter-one
header: Kedves Kole és Stane!
blockOne:
  image: ../../../assets/letter-01/01.png
  alt: Egy ember vizeskannákat húz, miközben sörön ábrándozik.
  text: Nincs víz. A város másik végéből hozzuk.
blockTwo:
  image: ../../../assets/letter-01/02.png
  alt: Az egér a lyukba fut, miközben húzza a farkába kapaszkodó embert.
  text: A gránátok még mindig esnek. Kifejlesztettük a megmenekülés módját.
blockThree:
  image: ../../../assets/letter-01/03.png
  alt: Az emberek átfutnak az utcán a „Vigyázat, orvlövész!” jel mellett.
  text:
    Számos kereszteződésen még át kell futni. A közlekedési lámpák helyett figyelmeztető táblák
    vannak.
  warningInscription: Vigyázat, orvlövész!
blockFour:
  image: ../../../assets/letter-01/04.png
  alt:
    "Az utolsó fa a parkban, egy kis nyírfa felirattal: „Aki kivágja ezt a nyírfát, annak ez lesz
    az utolsó!”"
  text:
    "Télen szinte az összes, városban található fát kivágták tűzifának. Csupán néhányat hagytak
    meg. Egy ilyent (egy kis nyírfa) láttam az Állatorvostudományi Karnál. Egy tábla áll rajta a
    következő felirattal:"
  treeInscription: Aki kivágja ezt a nyírfát, annak ez lesz az utolsó!

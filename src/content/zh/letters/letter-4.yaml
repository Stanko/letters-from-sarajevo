key: letter-4
lang: zh
slug: disifengxin
title: 第四封信
template: letter-four
date: 萨拉热窝（Sarajevo），1993年8月20日
header: 亲爱的科乐（Kole）和斯塔内（Stane），
sentenceOne:
  - 你们
  - image: ../../../assets/letter-04/left.png
    alt: 离开萨拉热窝
    modifier: xwide
  - 已经一年了。
sentenceTwo:
  - 这段时间里，
  - image: ../../../assets/letter-04/earth.png
    alt: 地球
  - 已经
  - image: ../../../assets/letter-04/earth-run.png
    alt: 绕着
    modifier: xl
  - image: ../../../assets/letter-04/sun.png
    alt: 太阳
    modifier: lg
  - 转了一圈。
sentenceThree:
  - 这段时间里，你们走的路要短一些：从萨拉热窝到迪夫利亚纳（Divljana）。
sentenceFour:
  - 你们变了吗？→
  - image: ../../../assets/letter-04/thin.png
    alt: 变瘦了
  - ，还是
  - image: ../../../assets/letter-04/fat.png
    alt: 变胖了
  - ，还是
  - image: ../../../assets/letter-04/mustaches.png
    alt: 长了胡子
    modifier: xl
  - ？
sentenceLeft:
  text: 你们做体操吗？
  image: ../../../assets/letter-04/lazy.png
  alt: 科乐和斯塔内躺在沙发上抽烟。
sentenceRight:
  text: 你们听妈妈的话吗？
  image: ../../../assets/letter-04/mom.png
  alt: 妈妈站在科乐和斯塔内身后，手里拿着擀面杖，戴着拳击手套。
blockOne:
  image: ../../../assets/letter-04/truce.png
  alt: 一个士兵躺在大炮上，炮管被软木塞堵住了。
  text: 这里已经平静了十来天。
blockTwo:
  image: ../../../assets/letter-04/electricity.png
  alt: 灯泡亮着，一个人受不了灯光，没法直视它。
  text: 停了好久好久的电，昨晚终于来电了。
  textBottom: 我们已经习惯了黑暗。
blockThree:
  image: ../../../assets/letter-04/sick.png
  alt: 一个人拿着玩具和拨浪鼓。
  text: 过去这一年，这里的日子很难熬。有些人没能撑住，精神有点儿“不对劲”了。
blockFour:
  image: ../../../assets/letter-04/icarus.png
  alt: 爸爸幻想着拥有伊卡洛斯（Ikar）的翅膀。
  text: |-
    向你们问好！
    希望很快见到你们。

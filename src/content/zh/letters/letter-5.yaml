lang: zh
slug: diwufengxin
title: 第五封信
template: letter-five
date: 萨拉热窝（Sarajevo），1993年12月2日
header: 亲爱的斯塔内（Stane）和科乐（Kole），
intro: 我这里还是老样子：
newsImage:
  image: ../../../assets/letter-05/news.png
  alt: 没有电，没有水，没有面包，没有电话。
paragraphs:
  - text: 我弄到一个小炉子，放在了房间里。可以在上面煮茶。
    caption: （图1）
  - text: 炉子又小又黑，还很丑。所以我给它画上了眉毛和鼻子。炉门上本来就有几个圆孔，可以从那里看到火苗。打开灰斗时，它看起来就像在打哈欠，或者在说话。
    caption: （图2）
stoveImage:
  image: ../../../assets/letter-05/stove.png
  alt: 画上了眉毛和鼻子的炉子。
signoff: 向你们问好！

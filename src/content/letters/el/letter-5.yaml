key: letter-5
lang: el
slug: pempto-gramma
title: Πέμπτο γράμμα
template: letter-five
date: Σαράγιεβο, 2 Δεκεμβρίου 1993
header: Αγαπητοί Στάνε και Κώστα,
intro: "Εδώ από νέα τίποτα:"
newsImage:
  image: ../../../assets/letter-05/news.png
  alt: Δεν έχουμε ρεύμα, ούτε νερό, ούτε ψωμί, ούτε τηλέφωνο.
paragraphs:
  - text: Απέκτησα μια μικρή σόμπα που την έστησα στο δωμάτιό μου. Μπορώ να φτιάξω τσάι σ’ αυτήν.
    caption: (Εικόνα 1).
  - text:
      Η σόμπα είναι μικρή, μαύρη και άσχημη. Γι’ αυτό της ζωγράφισα φρύδια και μύτη. Είχε ήδη
      κυκλικά ανοίγματα στα πορτάκια της, μέσω των οποίων μπορούσαν να φανούν φλόγες. Όταν ανοίγεις
      το πορτάκι που έχει από κάτω που μαζεύει τις στάχτες, είναι σαν να χασμουριέται ή να μιλάει.
    caption: (Εικόνα 2).
stoveImage:
  image: ../../../assets/letter-05/stove.png
  alt: Σόμπα με ζωγραφισμένα φρύδια και μύτη.
signoff: Πολλούς χαιρετισμούς!

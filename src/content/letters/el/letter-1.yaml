key: letter-1
lang: el
slug: proto-gramma
title: Πρώτο γράμμα
template: letter-one
header: Αγαπητοί Κώστα και Στάνε,
blockOne:
  image: ../../../assets/letter-01/01.png
  alt: Ένας άντρας κουβαλά μπιτόνια με νερό, ενώ φαντάζεται μια μπύρα.
  text: Δεν υπάρχει νερό. Το κουβαλάμε από την άλλη άκρη της πόλης.
blockTwo:
  image: ../../../assets/letter-01/02.png
  alt: Το ποντίκι διαφεύγει από μια τρύπα, τραβώντας έναν άνθρωπο που το κρατάει από την ουρά.
  text: Οι οβίδες συνεχίζουν να πέφτουν. Έχουμε τελειοποιήσει τρόπους διάσωσης.
blockThree:
  image: ../../../assets/letter-01/03.png
  alt:
    Οι άνθρωποι τρέχουν στο απέναντι πεζοδρόμιο όπου είναι αναρτημένη η πινακίδα "Προσοχή!
    Ελεύθεροι σκοπευτές!".
  text:
    Στις διασταυρώσεις του δρόμου, συνεχίζουμε να είμαστε αναγκασμένοι να τρέχουμε. Αντί για
    φανάρια, στέκονται προειδοποιητικές πινακίδες.
  warningInscription: Προσοχή! Ελεύθεροι σκοπευτές!
blockFour:
  image: ../../../assets/letter-01/04.png
  alt:
    Το τελευταίο δέντρο στο πάρκο, ένα μικρό δέντρο σημύδας με την επιγραφή «Αν κόψεις αυτή τη
    σημύδα, θα είναι η τελευταία σου!».
  text:
    "Το χειμώνα, που πέρασε, σχεδόν όλα τα δέντρα της πόλης κόπηκαν για θέρμανση. Διατηρήθηκαν
    μόνο λίγα. Έξω από την κτηνιατρική σχολή είδα ένα τέτοιο: μια μικρή σημύδα. Πάνω της υπάρχει μια
    πινακίδα:"
  treeInscription: Αν κόψεις αυτή τη σημύδα, θα είναι η τελευταία σου!

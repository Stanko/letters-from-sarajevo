key: letter-4
lang: ru
slug: cetvertoye-pismo
title: Четвертое письмо
template: letter-four
date: Сараево, 20.VIII 1993
header: Дорогие Коле и Стане,
sentenceOne:
  - Прошел уже год с того дня как вы
  - image: ../../../assets/letter-04/left.png
    alt: уехали из Сараева
    modifier: xwide
sentenceTwo:
  - За это время
  - image: ../../../assets/letter-04/earth.png
    alt: Земля
  - один раз
  - image: ../../../assets/letter-04/earth-run.png
    alt: обошла
    modifier: xl
  - вокруг
  - image: ../../../assets/letter-04/sun.png
    alt: Солнца
    modifier: lg
  - .
sentenceThree:
  - "Вы за это время проделали более короткий путь: Сараево - Дивляна."
sentenceFour:
  - Изменились ли вы →
  - image: ../../../assets/letter-04/thin.png
    alt: похудели
  - или
  - image: ../../../assets/letter-04/fat.png
    alt: поправились
  - или
  - image: ../../../assets/letter-04/mustaches.png
    alt: отрастили усы
    modifier: xl
  - "?"
sentenceLeft:
  text: Делаете ли вы гимнастику?
  image: ../../../assets/letter-04/lazy.png
  alt: Коле и Стане лежат на диване и курят.
sentenceRight:
  text: Слушаетесь ли вы маму?
  image: ../../../assets/letter-04/mom.png
  alt: Мама стоит позади Коле и Стане со скалкой и боксерской перчаткой.
blockOne:
  image: ../../../assets/letter-04/truce.png
  alt: Солдат лежит на пушке с заткнутым дулом.
  text: Здесь уже около десяти дней спокойно.
blockTwo:
  image: ../../../assets/letter-04/electricity.png
  alt: Включенная лампочка и человек, который не может на нее смотреть.
  text: Вчера вечером после долгого-долгого времени дали электричество.
  textBottom: Мы здесь уже привыкли к темноте.
blockThree:
  image: ../../../assets/letter-04/sick.png
  alt: Человек с игрушкой и погремушкой.
  text: Прошлый год здесь был очень тяжелым, некоторые не выдержали, у них слегка поехала крыша.
blockFour:
  image: ../../../assets/letter-04/icarus.png
  alt: Папа мечтает о крыльях Икара.
  text: |-
    Огромный вам привет!
    Надеюсь, что мы скоро увидимся.

key: letter-5
lang: ru
slug: pyatoye-pismo
title: Пятое письмо
template: letter-five
date: Сараево, 2.XII 1993.
header: Дорогие Коле и Стане,
intro: "У меня ничего нового:"
newsImage:
  image: ../../../assets/letter-05/news.png
  alt: Нет электричества, нет воды, нет хлеба, нет телефона
paragraphs:
  - text: Я получил небольшую печку, которую поставил в комнате. На ней я могу согреть чай.
    caption: (Рисунок 1)
  - text:
      Печка маленькая, черная, некрасивая. Поэтому я нарисовал ей брови и нос. На дверцах у нее уже
      есть круглые отверстия, через которые видно пламя. Если открыть поддувало, то кажется, что она
      зевает или говорит.
    caption: (Рисунок 2)
stoveImage:
  image: ../../../assets/letter-05/stove.png
  alt: Печь с нарисованными бровями и носом
signoff: Большой привет!

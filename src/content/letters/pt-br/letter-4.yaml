key: letter-4
lang: pt-br
slug: quarta-carta
title: Quarta carta
template: letter-four
date: Sarajevo, 20.VIII 1993
header: Queridos Kole e Stane,
sentenceOne:
  - Já faz um ano desde que vocês
  - image: ../../../assets/letter-04/left.png
    alt: foram embora de Sarajevo
    modifier: xwide
sentenceTwo:
  - Nesse tempo,
  - image: ../../../assets/letter-04/earth.png
    alt: a Terra
  - deu
  - image: ../../../assets/letter-04/earth-run.png
    alt: uma volta
    modifier: xl
  - ao redor
  - image: ../../../assets/letter-04/sun.png
    alt: do Sol
    modifier: lg
sentenceThree:
  - "Nesse tempo, vocês percorreram um caminho um pouco menor: Sarajevo - Divljana."
sentenceFour:
  - Vocês mudaram →
  - image: ../../../assets/letter-04/thin.png
    alt: ficaram mais magros
  - ou
  - image: ../../../assets/letter-04/fat.png
    alt: mais gordos
  - ou
  - image: ../../../assets/letter-04/mustaches.png
    alt: deixaram crescer os bigodes
    modifier: xl
  - "?"
sentenceLeft:
  text: Estão fazendo ginástica?
  image: ../../../assets/letter-04/lazy.png
  alt: Kole e Stane deitados no sofá e fumando.
sentenceRight:
  text: Estão ouvindo a mãe de vocês?
  image: ../../../assets/letter-04/mom.png
  alt: Mamãe atrás de Kole e Stane com um rolo de massa e uma luva de boxe.
blockOne:
  image: ../../../assets/letter-04/truce.png
  alt: Um soldado deitado em um canhão tampado com uma rolha.
  text: Os últimos dez dias, mais ou menos, têm sido tranquilos por aqui.
blockTwo:
  image: ../../../assets/letter-04/electricity.png
  alt: Uma lâmpada acesa na frente de um homem que não consegue olhar para ela.
  text: Na última noite, depois de muito, muito tempo, nossa luz voltou.
  textBottom: Nós já estávamos nos acostumando com a escuridão.
blockThree:
  image: ../../../assets/letter-04/sick.png
  alt: Um homem com um brinquedo e um chocalho.
  text: O último ano foi muito difícil por aqui, alguns não reagiram muito bem e ficaram meio lelé da cuca.
blockFour:
  image: ../../../assets/letter-04/icarus.png
  alt: Pai sonhando acordado em ter as asas de Ícaro.
  text: |-
    Com muito amor!
    Espero vê-los em breve

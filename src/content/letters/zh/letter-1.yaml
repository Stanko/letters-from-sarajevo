key: letter-1
lang: zh
slug: diyifengxin
title: 第一封信
template: letter-one
header: 亲爱的科乐（Kole）和斯塔内（Stane），
blockOne:
  image: ../../../assets/letter-01/01.png
  alt: 一个人拖着装水的桶，心里却想着啤酒。
  text: 没水了。我们得从城的另一头把水拖回来。
blockTwo:
  image: ../../../assets/letter-01/02.png
  alt: 一只老鼠往洞里逃，拖着一个抓住它尾巴的人。
  text: 炮弹还在落下来。我们已经练好了逃生的本事。
blockThree:
  image: ../../../assets/letter-01/03.png
  alt: 人们跑着穿过街道，旁边立着一块“当心狙击手”的牌子。
  text: 过很多路口时，还是得跑过去。红绿灯的位置上立着警告牌。
  warningInscription: 当心狙击手！
blockFour:
  image: ../../../assets/letter-01/04.png
  alt: 公园里最后一棵树是一棵小白桦树，上面挂着牌子：“谁砍了这棵桦树，这就是他砍的最后一棵树！”
  text: 这个冬天，城里的树几乎都被砍来烧火取暖了。只剩下零星几棵。我在兽医学院附近就见到过一棵（一棵小白桦树）。树上挂着一块牌子，上面写着：
  treeInscription: 谁砍了这棵桦树，这就是他砍的最后一棵树！
